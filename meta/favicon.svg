
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Cybernetic Cyan to Indigo Gradient -->
    <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Glow Gradient for Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filter for subtle neon bloom -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Stylized Geometric AR Logo -->
  <g filter="url(#neonGlow)">
    <!-- A Left Stem (Diagonal) -->
    <path d="M 26 96 L 50 32 L 64 32 L 40 96 Z" fill="url(#arGrad)" />

    <!-- Shared Vertical Spine (A right leg / R stem) -->
    <rect x="52" y="32" width="13" height="64" rx="2" fill="url(#arGrad)" />

    <!-- A Horizontal Bar bridging to R -->
    <rect x="36" y="66" width="34" height="11" rx="2" fill="url(#arGrad)" />

    <!-- R Top Curve / Loop (Futuristic rounded geometry) -->
    <path d="M 64 32 L 86 32 C 99 32 108 41 108 51 C 108 61 99 70 86 70 L 64 70 Z" 
          fill="none" stroke="url(#arGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- R Kick Leg (45-degree angle stroke) -->
    <path d="M 75 66 L 98 96 L 105 96 L 85 66 Z" fill="url(#arGrad)" />

    <!-- AI Circuit Neural Connection Nodes -->
    <!-- Apex Spark -->
    <circle cx="50" cy="32" r="4" fill="#ffffff" />
    <!-- R-Loop Node -->
    <circle cx="108" cy="51" r="3.5" fill="#38bdf8" />
    <!-- Kick Node -->
    <circle cx="98" cy="96" r="3.5" fill="#818cf8" />
    <!-- Base Node A -->
    <circle cx="26" cy="96" r="3.5" fill="#00f2fe" />
  </g>
</svg>
