
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Space Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090e1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Synapse Gradient 1 -->
    <linearGradient id="synapseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Synapse Gradient 2 (Perpendicular) -->
    <linearGradient id="synapseGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Bloom Filter -->
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#borderGlow)" stroke-width="2.5" />

  <g filter="url(#bloom)" transform="translate(64, 64)">
    <!-- Outer Neural Orbital Ring 1 (Rotated -30 deg) -->
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#synapseGrad1)" stroke-width="3" transform="rotate(-30)" stroke-dasharray="14 7 28 7"/>

    <!-- Outer Neural Orbital Ring 2 (Rotated 30 deg) -->
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#synapseGrad2)" stroke-width="3" transform="rotate(30)" stroke-dasharray="28 7 14 7"/>

    <!-- Outer Neural Orbital Ring 3 (Rotated 90 deg) -->
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="url(#synapseGrad1)" stroke-width="2.5" transform="rotate(90)" stroke-opacity="0.75"/>

    <!-- Radial Synaptic Connector Lines to Nodes -->
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="44" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="-38" y2="-22" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="38" y2="-22" stroke="#818cf8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="-38" y2="22" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="38" y2="22" stroke="#818cf8" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Hexagonal Synaptic Nodes -->
    <circle cx="0" cy="-44" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="44" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="-38" cy="-22" r="4" fill="#00f2fe" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="38" cy="-22" r="4" fill="#818cf8" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="-38" cy="22" r="4" fill="#00f2fe" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="38" cy="22" r="4.5" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>

    <!-- Central Neural Core Corona / Energy Halo -->
    <circle cx="0" cy="0" r="22" fill="url(#coreGlow)" opacity="0.65"/>

    <!-- Geometric Inner Processing Unit -->
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#090e1d" stroke="#00f2fe" stroke-width="2"/>

    <!-- Inner Core Orb -->
    <circle cx="0" cy="0" r="7" fill="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
</svg>
