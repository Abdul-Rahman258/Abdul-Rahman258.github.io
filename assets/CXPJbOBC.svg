<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="650" cy="120" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="300" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="580" cy="280" r="2" fill="#ffffff" opacity="0.8"/>
  <!-- Planet & Rings -->
  <circle cx="400" cy="190" r="75" fill="url(#planet)"/>
  <ellipse cx="400" cy="190" rx="140" ry="30" fill="none" stroke="#a5b4fc" stroke-width="4" transform="rotate(-15 400 190)"/>
  <text x="400" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">SPACE EXPLORATION CHATBOT // RAG</text>
</svg>