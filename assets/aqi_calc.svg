<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="aqi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f1a"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="aqi-gauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aqi-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#aqi-bg)"/>
  <circle cx="400" cy="200" r="160" fill="url(#aqi-glow)"/>

  <!-- Telemetry Cloud & Gauge -->
  <g transform="translate(400, 180)">
    <!-- Outer Arc Track -->
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#134e4a" stroke-width="8"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#aqi-gauge)" stroke-width="10" stroke-dasharray="480 660" stroke-linecap="round" transform="rotate(-135 0 0)"/>
    
    <!-- Cloud Icon in center background -->
    <path d="M -35 -30 A 25 25 0 0 1 20 -40 A 35 35 0 0 1 50 -10 A 25 25 0 0 1 35 30 L -35 30 A 25 25 0 0 1 -35 -30 Z" fill="#134e4a" opacity="0.35"/>
    
    <!-- Numeric Sensor Reading -->
    <text x="0" y="-12" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">AIR QUALITY INDEX</text>
    <text x="0" y="32" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">38</text>
    
    <!-- Status Pill -->
    <rect x="-65" y="48" width="130" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="-48" cy="60" r="4" fill="#34d399"/>
    <text x="4" y="65" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="1">STATUS: GOOD</text>
  </g>

  <!-- Bottom Banner -->
  <text x="400" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="2">SERVERLESS AQI // REAL-TIME MONITORING</text>
</svg>