  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="160" fill="#38bdf8" opacity="0.05"/>
  <g transform="translate(400, 180)">
    <!-- Butterfly Wings -->
    <path d="M 0 -20 C -60 -100 -180 -80 -160 20 C -150 80 -60 70 0 20 Z" fill="url(#accent)" opacity="0.85"/>
    <path d="M 0 -20 C 60 -100 180 -80 160 20 C 150 80 60 70 0 20 Z" fill="url(#accent)" opacity="0.85"/>
    <path d="M 0 20 C -70 50 -120 120 -60 140 C -20 150 0 80 0 30 Z" fill="url(#accent)" opacity="0.7"/>
    <path d="M 0 20 C 70 50 120 120 60 140 C 20 150 0 80 0 30 Z" fill="url(#accent)" opacity="0.7"/>
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="6" ry="60" fill="#ffffff"/>
    <circle cx="0" cy="-45" r="8" fill="#ffffff"/>
    <line x1="0" y1="-45" x2="-20" y2="-75" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="-45" x2="20" y2="-75" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="400" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">CNN CLASSIFICATION // 94% ACCURACY</text>
</svg>