  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="140" fill="#f59e0b" opacity="0.06"/>
  <g transform="translate(400, 190)">
    <!-- Rocket Icon -->
    <path d="M 0 -70 Q 40 -10 30 50 L -30 50 Q -40 -10 0 -70 Z" fill="url(#glow)"/>
    <!-- Wings -->
