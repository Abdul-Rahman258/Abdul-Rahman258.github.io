  </g>
  <text x="400" y="310" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ASAAN LABS</text>
  <text x="400" y="360" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="4">AI PRODUCTS &amp; MULTI-AGENT SYSTEMS</text>
</svg>