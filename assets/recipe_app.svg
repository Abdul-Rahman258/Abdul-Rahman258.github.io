<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="recipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="culinary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="recipe-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#recipe-bg)"/>
  <circle cx="400" cy="200" r="160" fill="url(#recipe-glow)"/>

  <!-- Chef Cloche & Search / Database Element -->
  <g transform="translate(400, 185)">
    <!-- Cloche dome -->
    <path d="M -90 15 C -90 -75 90 -75 90 15 Z" fill="url(#culinary)"/>
    <rect x="-105" y="15" width="210" height="14" rx="4" fill="#fbbf24"/>
    <!-- Cloche handle -->
    <circle cx="0" cy="-80" r="14" fill="#fbbf24"/>
    <rect x="-4" y="-70" width="8" height="10" fill="#fbbf24"/>
    
    <!-- Steam Curves -->
    <path d="M -35 -100 Q -25 -120 -35 -140" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -110 Q 10 -130 0 -150" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 -100 Q 45 -120 35 -140" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Database latency badge -->
    <rect x="-85" y="45" width="170" height="26" rx="6" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="62" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">MONGODB ATLAS // &lt;100MS</text>
  </g>

  <!-- Bottom Banner -->
  <text x="400" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">RECIPE SEARCH &amp; MANAGEMENT</text>
</svg>