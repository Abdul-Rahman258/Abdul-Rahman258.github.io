    <path d="M 80 -50 L 50 0 L 110 0 Z" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M 40 0 Q 80 30 120 0 Z" fill="url(#gold)"/>
    <!-- Base -->
