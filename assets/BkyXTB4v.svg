      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Scales of Justice -->
  <g transform="translate(400, 180)">
    <line x1="0" y1="-70" x2="0" y2="70" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Scale -->
    <path d="M -80 -50 L -110 0 L -50 0 Z" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M -120 0 Q -80 30 -40 0 Z" fill="url(#gold)"/>
